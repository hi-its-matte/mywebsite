  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito in Manutenzione</title>
  <style>
    /* --- Base Style (stesso schema del tuo style.css senza blu) --- */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d0d;
      color: #f2f2f2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
      overflow: hidden;
    }

    h1 {
      font-size: 3.5rem;
      margin: 0;
      background: linear-gradient(45deg, #ff8800, #ffb84d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(255, 136, 0, 0.3); }
      50% { text-shadow: 0 0 40px rgba(255, 184, 77, 0.6); }
    }

    p {
      color: #ccc;
      font-size: 1.3rem;
      margin: 1.5rem 0 2rem;
      max-width: 600px;
      line-height: 1.6;
    }

    .gear {
      width: 90px;
      height: 90px;
      margin-bottom: 1.5rem;
      animation: rotate 5s linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 136, 0, 0.4));
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.5rem;
      background: linear-gradient(45deg, #ff8800, #cc6a00);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 136, 0, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 136, 0, 0.5);
      background: linear-gradient(45deg, #cc6a00, #a95400);
    }

    footer {
      position: absolute;
      bottom: 20px;
      color: #777;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      h1 { font-size: 2.5rem; }
      p { font-size: 1.1rem; }
      .gear { width: 70px; height: 70px; }
    }
  </style>
